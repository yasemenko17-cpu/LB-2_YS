events {}

http {
    upstream blog_backend {
        server 127.0.0.1:9033;
    }

    server {
        listen 443 ssl;
        server_name blog.lab.test;

        ssl_certificate certs/blog.crt;
        ssl_certificate_key certs/blog.key;

        # 1. Точний збіг для /health
        location = /health {
            return 200 "OK";
        }

        # 2. Статичні зображення (png, jpg)
        location ~* \.(png|jpg)$ {
            root /var/www/images;
        }

        # 3. Проксіювання решти запитів на бекенд
        location / {
            proxy_pass http://blog_backend;
            proxy_set_header Host $host;
            proxy_set_header X-App-Name TechLife;
        }
    }
}